<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAE · Sistema de Asesorías Estudiantil</title>
<style>
:root{--navy:#12294d;--navy2:#1d3f6e;--gold:#d8a31a;--gold2:#f0c046;--bg:#f4f6fa;--ink:#1b2433;--mut:#5b6679;--ok:#1f7a4d;--bad:#b3261e;--line:#dfe4ec;--card:#fff;--shadow:0 1px 2px rgba(18,41,77,.06),0 6px 20px rgba(18,41,77,.07);--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#e8ecf3;--mut:#9aa6ba;--line:#26324a;--card:#141e33;--navy:#0a1428;--navy2:#13264a;--shadow:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .45em;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.6rem}h3{font-size:1.2rem}
header{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:.75rem 1.2rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(10,20,40,.25)}
header b{font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.04em;border-left:4px solid var(--gold);padding-left:.7rem}
nav{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}nav a{color:#c9d5ea;padding:.4rem .8rem;border-radius:999px;text-decoration:none;font-size:.95rem;transition:background .15s,color .15s}
nav a.on{background:var(--gold);color:#1b1500;font-weight:600}nav a:hover{background:rgba(255,255,255,.14);color:#fff}
#who{font-size:.9rem;display:flex;gap:.6rem;align-items:center}#who button{padding:.3rem .7rem;font-size:.85rem}
main{max-width:1040px;margin:0 auto;padding:1.6rem 1.1rem 3.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;margin-bottom:.9rem;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid>.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(18,41,77,.13)}
button,.btn{font:inherit;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:.55rem 1rem;cursor:pointer;font-weight:500;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.98)}
button.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1500;font-weight:700;box-shadow:0 3px 10px rgba(216,163,26,.35)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin:.25rem 0 .9rem;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,163,26,.2);outline:none}
label{font-size:.88rem;color:var(--mut);font-weight:500}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--navy2),var(--navy));color:var(--gold2);display:grid;place-items:center;font:700 1.15rem Georgia;flex:none;box-shadow:inset 0 0 0 2px rgba(216,163,26,.4)}
.row{display:flex;gap:.85rem;align-items:center}.mut{color:var(--mut);font-size:.9rem}
.tag{font-size:.8rem;font-weight:600;padding:.15rem .65rem;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pendiente{color:#8a5a00;border-color:#e8c46a;background:#fff8e6}.confirmada{color:var(--ok);border-color:#9fd3b8;background:#eaf7f0}
.realizada{color:var(--mut)}.cancelada,.inasistencia{color:var(--bad);border-color:#f0b5b0;background:#fdeeed}
.slots{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.slots button{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:.92rem;padding:.45rem .8rem;box-shadow:none}
.slots button:hover{border-color:var(--gold);filter:none}
.slots button.sel{background:var(--gold);border-color:var(--gold);color:#1b1500;font-weight:700}
.hero{display:grid;gap:2rem;grid-template-columns:1.15fr 1fr;align-items:center;padding:2.2rem 0 1rem;position:relative}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5.5vw,3.4rem);color:var(--navy)}
@media(prefers-color-scheme:dark){.hero h1{color:var(--ink)}}
.hero p{font-size:1.08rem;color:var(--mut);max-width:34rem}
.hero .kicker{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a5a00;background:#fff3cf;padding:.3rem .7rem;border-radius:99px;margin-bottom:1rem}
@media(prefers-color-scheme:dark){.hero .kicker{color:var(--gold2);background:#2a2411}}
.hero form{padding:1.6rem;border-top:4px solid var(--gold)}
.hero form h2{font-size:1.4rem}
.hero form button{width:100%;margin-top:.4rem;padding:.7rem}
.hero form p{margin:1rem 0 0}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:11px;display:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:4px solid var(--gold);font-weight:500}
#toast.err{background:var(--bad);border-left-color:#fff}.tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
main>h2{margin-bottom:.9rem}
main>p.mut{margin-top:-.4rem}
pre{font:.88rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:8px;padding:.7rem .8rem;margin:.5rem 0 0 !important}
a{color:var(--navy)}@media(prefers-color-scheme:dark){a{color:var(--gold2)}}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}.qrcard{text-align:center}.qrcard img{width:100%;max-width:260px;height:auto;background:#fff;border-radius:8px}
@media print{header,#toast,.noprint{display:none!important}body{background:#fff;color:#000}.qrs{display:block}.qrcard{break-inside:avoid;page-break-after:always;box-shadow:none;border:2px solid #000;color:#000;background:#fff;padding:2rem;margin:0 auto;max-width:15cm}.qrcard img{max-width:11cm}.qrcard h3{font-size:1.6rem}.qrcard .mut{color:#333}}
#det{margin-top:.4rem}
#det .card{border-top:4px solid var(--gold)}
#det h3{margin-bottom:.6rem}
#l .card p{color:var(--mut);margin:.5rem 0 .8rem;font-size:.95rem}
#l .card .row{margin-bottom:.4rem}
#l .card:after{content:"";display:block;clear:both}
#l .card .gold{float:right;margin-top:-.2rem}
img[alt^="Código"]{border-radius:12px;border:1px solid var(--line);padding:6px;background:#fff}
/* Reporte: tarjetas de cifras compactas y tablas que se deslizan sin recortar columnas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:.8rem 0}.stats .card{padding:.8rem 1rem}.stats h2{margin:.2rem 0 0}.rep{width:100%;border-collapse:collapse}.rep th,.rep td{padding:.5rem .8rem;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}.tabs button{background:transparent;color:inherit;border:1px solid var(--line)}.tabs button.on{background:var(--navy,#16264a);color:#fff;border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.6rem 1rem}
.pw{display:flex;gap:.4rem;align-items:flex-start}.pw input{flex:1 1 0;width:100%;min-width:0}.pw .ver{flex:none;width:auto;margin:.25rem 0 .9rem;padding:.6rem .8rem;white-space:nowrap}
.chk{display:flex;align-items:center;gap:.55rem;margin:.1rem 0 .3rem;font-weight:400;cursor:pointer}.chk input{width:auto;margin:0;flex:none}
@media(max-width:560px){header{gap:.6rem}nav{flex:1 1 100%;order:3}#who{width:100%;justify-content:space-between}}
</style></head><body>
<header><b>SAE</b><nav id="nav" aria-label="Principal"></nav><span id="who" class="mut" style="color:#cfd8e8"></span></header>
<main id="app" aria-live="polite"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=null, sel=null;
async function api(url,method='GET',body){const r=await fetch('/api'+url,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error inesperado');return j}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const fecha=f=>new Date(f+'T12:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const ini=n=>n.replace(/^(Dr\.|Dra\.|Mtro\.|Mtra\.)\s*/,'').split(' ').slice(0,2).map(x=>x[0]).join('');
const rutas={
  catalogo:{roles:['estudiante','docente','secretaria'],t:'Docentes'},
  mis:{roles:['estudiante','docente','secretaria'],t:'Historial'},
  agenda:{roles:['docente'],t:'Mi disponibilidad'},
  reporte:{roles:['docente','secretaria'],t:'Reporte'},
  admin:{roles:['secretaria'],t:'Administración'},
  bitacora:{roles:['secretaria'],t:'Notificaciones'},
  qr:{roles:['estudiante','docente','secretaria'],t:'Código QR'}};
async function init(){U=(await api('/me')).user;nav()}
function nav(){const r=location.hash.slice(1)||'catalogo',dm=/^docente\/(\d{1,9})$/.exec(r);$('#who').innerHTML=U?`${esc(U.nombre)} (${U.rol}) <button class="ghost" style="color:#fff;border-color:#4a5d82" onclick="salir()">Salir</button>`:'';
  $('#nav').innerHTML=U?Object.entries(rutas).filter(([k,v])=>v.roles.includes(U.rol)).map(([k,v])=>`<a href="#${k}" class="${k===r?'on':''}">${v.t}</a>`).join(''):'';
  if(!U)return login();if(dm)return docente(+dm[1]);if(rutas[r]&&!rutas[r].roles.includes(U.rol))return catalogo();({catalogo,mis,agenda,reporte,admin,bitacora,qr}[r]||catalogo)()}
addEventListener('hashchange',nav);
async function salir(){await api('/logout','POST');U=null;nav()}
// Campo de contraseña con botón Mostrar/Ocultar. El botón no envía el formulario y avisa su estado a lectores de pantalla.
const campoPass=(min,auto)=>`<div class="pw"><input id="p" type="password" required minlength="${min}" autocomplete="${auto}" autocapitalize="off" spellcheck="false"><button type="button" class="ghost ver" aria-pressed="false" aria-controls="p" aria-label="Mostrar contraseña" onclick="verPass(this)">Mostrar</button></div>`;
function verPass(b){const i=$('#p'),ver=i.type==='password';i.type=ver?'text':'password';b.textContent=ver?'Ocultar':'Mostrar';b.setAttribute('aria-pressed',String(ver));b.setAttribute('aria-label',(ver?'Ocultar':'Mostrar')+' contraseña');i.focus()}
function login(reg){ $('#app').innerHTML=`<section class="hero"><div><span class="kicker">Unidad Académica de Economía · UAN</span><h1>Encuentra a tu docente y agenda tu asesoría.</h1>
<p>Consulta la disponibilidad real de los docentes de la Unidad Académica de Economía, reserva un horario y recibe confirmación. Gratis y desde tu celular.</p>${/^#docente\/\d+$/.test(location.hash)?'<p class="tag confirmada" style="white-space:normal">Escaneaste el código de un docente: inicia sesión o crea tu cuenta y te llevamos directo a sus horarios.</p>':''}</div>
<form class="card" id="f"><h2>${reg?'Crear cuenta':'Iniciar sesión'}</h2>
<label for="m">Matrícula o clave de docente</label><input id="m" required maxlength="40" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Ej. 24100001 o DOC001">
${reg?'<label for="e">Correo institucional</label><input id="e" type="email" required autocomplete="email">':''}
<label for="p">Contraseña${reg?' (mínimo 8 caracteres)':''}</label>${campoPass(reg?8:1,reg?'new-password':'current-password')}
${reg?'':'<label class="chk"><input type="checkbox" id="rec"> Mantener la sesión abierta en este dispositivo</label><p class="mut" style="margin:0 0 .9rem;font-size:.85rem">Evita volver a iniciar sesión durante varios días. Úsalo solo en tu equipo personal, no en computadoras compartidas.</p>'}
<button class="gold" style="width:100%">${reg?'Crear cuenta':'Entrar'}</button>
<p class="mut" style="text-align:center"><a href="#" onclick="login(${!reg});return false">${reg?'Ya tengo cuenta':'Soy estudiante y no tengo cuenta'}</a>${reg?'':' · <a href="#" onclick="recuperar();return false">Olvidé mi contraseña</a>'}</p></form></section>`;
  $('#f').onsubmit=async e=>{e.preventDefault();try{const d={matricula:$('#m').value,email:reg?$('#e').value:undefined,password:$('#p').value,recordar:reg?undefined:$('#rec').checked};
    const r=await api(reg?'/registro':'/login','POST',d);if(r.pendiente)return verificar(d,r.correo);await init()}catch(x){toast(x.message,1)}}}
// Recuperar la contraseña: 1) matrícula → código al correo de la cuenta; 2) código + contraseña nueva. Los avisos no revelan si la matrícula tiene cuenta.
function recuperar(m=''){ $('#app').innerHTML=`<section class="hero"><div><span class="kicker">Recuperar acceso</span><h1>¿Olvidaste tu contraseña?</h1>
<p>Escribe tu matrícula o clave de docente. Si tiene una cuenta, enviamos un código de 6 dígitos al correo con el que se registró.</p></div>
<form class="card" id="r"><h2>Recuperar contraseña</h2><label for="m">Matrícula o clave de docente</label><input id="m" required maxlength="40" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Ej. 24100001 o DOC001" value="${esc(m)}">
<button class="gold" style="width:100%">Enviar código</button><p class="mut" style="text-align:center"><a href="#" id="at">Volver a iniciar sesión</a></p></form></section>`;
  $('#at').onclick=e=>{e.preventDefault();login()};
  $('#r').onsubmit=async e=>{e.preventDefault();try{const r=await api('/recuperar','POST',{matricula:$('#m').value});toast(r.mensaje);restablecer($('#m').value.trim())}catch(x){toast(x.message,1)}}}
function restablecer(m){ $('#app').innerHTML=`<section class="hero"><div><span class="kicker">Casi listo</span><h1>Escribe el código y tu contraseña nueva.</h1>
<p>Si la matrícula tiene una cuenta, el código llegó a su correo (revisa también el spam). Caduca en 15 minutos. Al cambiar la contraseña se cierran las sesiones abiertas.</p></div>
<form class="card" id="n"><h2>Contraseña nueva</h2><label for="c">Código de 6 dígitos</label>
<input id="c" required inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code">
<label for="p">Contraseña nueva (mínimo 8 caracteres; 10 para docentes y secretaría)</label>${campoPass(8,'new-password')}
<button class="gold" style="width:100%">Cambiar contraseña</button>
<p class="mut" style="text-align:center"><a href="#" id="re">Reenviar el código</a> · <a href="#" id="at">Volver</a></p></form></section>`;
  $('#c').focus();
  $('#n').onsubmit=async e=>{e.preventDefault();try{await api('/recuperar/confirmar','POST',{matricula:m,codigo:$('#c').value,password:$('#p').value});login();toast('Contraseña cambiada. Ya puedes iniciar sesión.')}catch(x){toast(x.message,1)}};
  $('#re').onclick=async e=>{e.preventDefault();try{const r=await api('/recuperar','POST',{matricula:m});toast(r.mensaje)}catch(x){toast(x.message,1)}};
  $('#at').onclick=e=>{e.preventDefault();login()}}
// Segundo paso del registro: el código de 6 dígitos que llegó al correo institucional (la cuenta se crea hasta confirmarlo).
function verificar(d,correo){ $('#app').innerHTML=`<section class="hero"><div><span class="kicker">Un paso más</span><h1>Revisa tu correo institucional.</h1>
<p>Para confirmar que la matrícula es tuya te enviamos un código de 6 dígitos a <b>${esc(correo)}</b>. Caduca en 15 minutos.</p></div>
<form class="card" id="v"><h2>Verificar correo</h2><label for="c">Código de 6 dígitos</label>
<input id="c" required inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code">
<button class="gold" style="width:100%">Verificar y crear cuenta</button>
<p class="mut" style="text-align:center"><a href="#" id="re">Reenviar el código</a> · <a href="#" id="at">Volver</a></p></form></section>`;
  $('#c').focus();
  $('#v').onsubmit=async e=>{e.preventDefault();try{await api('/registro/confirmar','POST',{matricula:d.matricula,codigo:$('#c').value});await init()}catch(x){toast(x.message,1)}};
  $('#re').onclick=async e=>{e.preventDefault();try{await api('/registro','POST',d);toast('Te enviamos un código nuevo.')}catch(x){toast(x.message,1)}};
  $('#at').onclick=e=>{e.preventDefault();login(true)}}
async function catalogo(){ $('#app').innerHTML=`<h2>Docentes</h2><label for="b">Busca por docente o materia</label><input id="b" type="search" placeholder="Ej. Estadística"><div id="l" class="grid"></div><div id="det"></div>`;
  let _t, _c=0;
  const pintar=async()=>{const seq=++_c,d=await api('/docentes?q='+encodeURIComponent($('#b').value));if(seq!==_c)return;
    $('#l').innerHTML=d.map(x=>`<div class="card"><div class="row"><div class="av">${esc(ini(x.nombre))}</div><div><b>${esc(x.nombre)}</b><div class="mut">${esc(x.cubiculo||'')}</div></div></div>
    <p>${esc(x.materias)}</p><span class="tag">${x.libres} horarios libres</span> ${U.rol==='estudiante'?`<button class="gold ag-btn" style="float:right" data-id="${x.id}" data-nombre="${esc(x.nombre)}" data-materia="${esc(x.materias.split(',')[0].trim())}">Agendar</button>`:''}</div>`).join('')||'<p class="mut">Sin resultados. Prueba con otra materia.</p>';
    $('#l').querySelectorAll('.ag-btn').forEach(b=>b.onclick=()=>agendar(+b.dataset.id,b.dataset.nombre,b.dataset.materia));};
  $('#b').oninput=()=>{clearTimeout(_t);_t=setTimeout(pintar,200)};pintar()}
// Enlace directo (#docente/<id>), el que abre el QR de cada docente: su ficha y, si eres estudiante, sus horarios libres para agendar.
async function docente(id){let d;try{d=await api('/docentes/'+id)}catch(x){$('#app').innerHTML=`<h2>Docente no encontrado</h2><div class="card"><p>Este docente ya no está en el sistema; puede que el código QR sea antiguo.</p><a href="#catalogo">Ver todos los docentes</a></div>`;return}
  $('#app').innerHTML=`<h2>Asesoría con ${esc(d.nombre)}</h2><div class="card"><div class="row"><div class="av">${esc(ini(d.nombre))}</div><div><b>${esc(d.nombre)}</b><div class="mut">${esc(d.cubiculo||'')}</div></div></div>
  <p>${esc(d.materias)}</p><span class="tag">${d.libres} horarios libres</span></div><div id="det"></div><p><a href="#catalogo">Ver todos los docentes</a></p>`;
  if(U.rol==='estudiante')agendar(d.id,d.nombre,d.materias.split(',')[0].trim());else $('#det').innerHTML='<p class="mut">Solo los estudiantes pueden agendar asesorías.</p>'}
async function agendar(id,nombre,materia){sel=null;const hs=await api(`/docentes/${id}/horarios`);
  $('#det').innerHTML=`<div class="card"><h3>Asesoría con ${esc(nombre)}</h3>${hs.length?`<label>Elige un horario</label><div class="slots">${hs.map(h=>`<button data-id="${h.id}" onclick="sel=${h.id};document.querySelectorAll('.slots button').forEach(b=>b.classList.toggle('sel',b.dataset.id==sel))">${fecha(h.fecha)} · ${h.hora}</button>`).join('')}</div>
  <label for="ma">Materia</label><input id="ma" value="${esc(materia)}"><label for="du">¿Cuál es tu duda?</label><textarea id="du" rows="3" placeholder="Describe el tema para que el docente se prepare"></textarea>
  <button class="gold" onclick="enviar()">Solicitar asesoría</button>`:'<p class="mut">Este docente no tiene horarios libres por ahora.</p>'}</div>`;$('#det').scrollIntoView({behavior:'smooth'})}
async function enviar(){if(!sel)return toast('Elige un horario.',1);try{await api('/asesorias','POST',{horario_id:sel,materia:$('#ma').value,duda:$('#du').value});toast('Solicitud enviada. Te llegó una confirmación.');location.hash='mis'}catch(x){toast(x.message,1)}}
async function mis(){const a=await api('/asesorias');$('#app').innerHTML=`<h2>Historial de asesorías</h2>`+(a.map(x=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(x.materia)}</b><span class="tag ${x.estado}">${x.estado}</span></div>
  <div class="mut">${fecha(x.fecha)} · ${x.hora} · ${U.rol==='docente'?'Estudiante: '+esc(x.estudiante):'Docente: '+esc(x.docente)}${U.rol==='secretaria'?' · Estudiante: '+esc(x.estudiante):''}</div><p>${esc(x.duda)}</p>
  ${acciones(x)}</div>`).join('')||'<p class="mut">Aún no hay asesorías. Ve a Docentes para agendar la primera.</p>')}
function acciones(x){if(['cancelada','realizada','inasistencia'].includes(x.estado))return'';
  if(U.rol==='docente')return(x.estado==='pendiente'?`<button onclick="estado(${x.id},'confirmada')">Confirmar</button> `:`<button onclick="estado(${x.id},'realizada')">Marcar realizada</button> `+(x.empezo?`<button class="ghost" onclick="estado(${x.id},'inasistencia')" title="El estudiante no se presentó">No asistió</button> `:''))+`<button class="ghost" onclick="estado(${x.id},'cancelada')">Cancelar</button>`;
  return U.rol==='estudiante'?`<button class="ghost" onclick="estado(${x.id},'cancelada')">Cancelar asesoría</button>`:''}
async function estado(id,e){try{await api('/asesorias/'+id,'PATCH',{estado:e});toast(e==='inasistencia'?'Inasistencia registrada.':'Asesoría '+e+'.');mis()}catch(x){toast(x.message,1)}}
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], DIAS_LARGO=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
async function agenda(){const [hs,ss]=await Promise.all([api('/mis-horarios'),api('/series')]),hoy=new Date().toLocaleDateString('en-CA');
  $('#app').innerHTML=`<h2>Mi disponibilidad</h2>
<form class="card" id="s"><h3>Repetir cada semana</h3><p class="mut">Crea de una vez tus horarios de asesoría para varias semanas. Después puedes quitar los que no necesites (un puente, una junta).</p>
<label>Días de la semana</label><div class="slots" id="dd">${DIAS.map((d,i)=>`<button type="button" data-d="${i+1}" aria-pressed="false" onclick="this.classList.toggle('sel');this.setAttribute('aria-pressed',this.classList.contains('sel'))">${d}</button>`).join('')}</div>
<div class="grid" style="gap:0 1rem"><div><label for="s1">Desde las</label><input id="s1" type="time" required value="10:00"></div><div><label for="s2">Hasta las</label><input id="s2" type="time" required value="12:00"></div>
<div><label for="s3">Duración de cada asesoría</label><select id="s3">${[15,20,30,40,45,60,90,120].map(m=>`<option value="${m}"${m===30?' selected':''}>${m} minutos</option>`).join('')}</select></div></div>
<div class="grid" style="gap:0 1rem"><div><label for="s4">Desde el día</label><input id="s4" type="date" required min="${hoy}" value="${hoy}"></div><div><label for="s5">Hasta el día (máximo 120 días)</label><input id="s5" type="date" required min="${hoy}"></div></div>
<button class="gold">Crear horarios</button></form>
${ss.length?`<h3>Mis series</h3>`+ss.map(x=>`<div class="card row" style="justify-content:space-between;flex-wrap:wrap"><div><b>${x.dias.map(d=>DIAS[d-1]).join(', ')}</b> · ${esc(x.inicio)}–${esc(x.fin)} · bloques de ${x.duracion} min<div class="mut">${fecha(x.desde)} al ${fecha(x.hasta)} · ${x.libres} libres, ${x.reservados} con asesoría</div></div>
<button class="ghost" onclick="quitarSerie(${x.id},${x.reservados})">Quitar los libres</button></div>`).join(''):''}
<form class="card" id="h"><h3>Agregar un horario suelto</h3><label for="fe">Fecha</label><input id="fe" type="date" required min="${hoy}"><label for="ho">Hora</label><input id="ho" type="time" required>
<button class="gold">Agregar horario</button></form>
<h3>Mis horarios próximos</h3>${hs.length?`<div class="card">`+Object.entries(hs.reduce((a,h)=>((a[h.fecha]??=[]).push(h),a),{})).map(([f,l])=>`<div style="padding:.5rem 0;border-bottom:1px solid var(--line)"><b>${fecha(f)}</b><div class="slots" style="margin:.35rem 0 0">${l.map(h=>h.estado?`<span class="tag ${esc(h.estado)}">${esc(h.hora)} · ${esc(h.estado)}</span>`:`<button type="button" class="ghost" onclick="quitarHorario(${h.id})" title="Quitar este horario" aria-label="Quitar el horario del ${esc(h.fecha)} a las ${esc(h.hora)}">${esc(h.hora)} ✕</button>`).join('')}</div></div>`).join('')+`</div>`:'<p class="mut">Todavía no tienes horarios. Crea una serie semanal o agrega uno suelto.</p>'}`;
  $('#s5').value=new Date(Date.now()+28*864e5).toLocaleDateString('en-CA');
  $('#s').onsubmit=async e=>{e.preventDefault();const dias=[...document.querySelectorAll('#dd .sel')].map(b=>+b.dataset.d);if(!dias.length)return toast('Elige al menos un día de la semana.',1);
    try{const r=await api('/series','POST',{dias,inicio:$('#s1').value,fin:$('#s2').value,duracion:+$('#s3').value,desde:$('#s4').value,hasta:$('#s5').value});
      toast(`Listo: ${r.creados+r.reactivados} horarios creados`+(r.yaExistian?`, ${r.yaExistian} ya existían`:'')+(r.pasados?`, ${r.pasados} omitidos por ser pasados`:'')+(r.ocupados?`, ${r.ocupados} ya tenían asesoría`:'')+'.');agenda()}catch(x){toast(x.message,1)}};
  $('#h').onsubmit=async e=>{e.preventDefault();try{await api('/horarios','POST',{fecha:$('#fe').value,hora:$('#ho').value});toast('Horario agregado.');agenda()}catch(x){toast(x.message,1)}}}
async function quitarHorario(id){try{await api('/horarios/'+id,'DELETE');toast('Horario quitado.');agenda()}catch(x){toast(x.message,1)}}
async function quitarSerie(id,res){if(!confirm('Se quitarán los horarios de esta serie que siguen libres'+(res?`; los ${res} que ya tienen asesoría se conservan`:'')+'. ¿Continuar?'))return;
  try{const r=await api('/series/'+id,'DELETE');toast(`Se quitaron ${r.quitados} horarios`+(r.conservados?` y se conservaron ${r.conservados} con asesoría`:'')+'.');agenda()}catch(x){toast(x.message,1)}}
// Reporte de inasistencias: del docente (las suyas) o de toda la Unidad (secretaría), por la fecha de la asesoría; con descarga en CSV para Excel.
async function reporte(){const hoy=new Date().toLocaleDateString('en-CA'),hace=new Date(Date.now()-29*864e5).toLocaleDateString('en-CA');
  $('#app').innerHTML=`<h2>Reporte de inasistencias</h2><form class="card row" id="rf" style="align-items:flex-end;flex-wrap:wrap;gap:1rem"><div><label for="r1">Desde</label><input id="r1" type="date" required value="${hace}"></div><div><label for="r2">Hasta</label><input id="r2" type="date" required value="${hoy}"></div>
<button class="gold">Ver reporte</button><a class="btn" id="rc" href="#">Descargar CSV</a></form><div id="rr"></div>`;
  const pintar=async()=>{const qs=`desde=${$('#r1').value}&hasta=${$('#r2').value}`;$('#rc').href='/api/reporte/inasistencias.csv?'+qs;
    try{const r=await api('/reporte?'+qs),t=r.totales,pc=v=>v===null?'—':v+' %';
      $('#rr').innerHTML=`<p class="mut">${r.alcance==='propio'?'Solo tus asesorías.':'Todas las asesorías de la Unidad.'} Del ${fecha(r.desde)} al ${fecha(r.hasta)}. La tasa de inasistencia es el porcentaje de las asesorías ya cerradas (realizadas o con inasistencia) en que el estudiante no se presentó.</p>
<div class="stats"><div class="card"><div class="mut">Asesorías</div><h2>${t.total}</h2></div><div class="card"><div class="mut">Realizadas</div><h2>${t.realizadas}</h2></div><div class="card"><div class="mut">Inasistencias</div><h2>${t.inasistencias}</h2></div>
<div class="card"><div class="mut">Tasa de inasistencia</div><h2>${pc(t.tasaInasistencia)}</h2></div><div class="card"><div class="mut">Canceladas</div><h2>${t.canceladas}</h2></div><div class="card"><div class="mut">Próximas</div><h2>${t.proximas}</h2></div></div>
${t.sinCerrar?`<p class="tag pendiente" style="white-space:normal">${t.sinCerrar} asesoría${t.sinCerrar===1?'':'s'} ya pasó y sigue sin cerrarse (el docente debe marcarla como realizada o con inasistencia).</p>`:''}
${r.alcance==='todos'?`<h3>Por docente</h3><div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Docente</th><th>Asesorías</th><th>Realizadas</th><th>Inasistencias</th><th>Tasa</th><th>Sin cerrar</th></tr></thead><tbody>${r.porDocente.map(d=>`<tr><td>${esc(d.nombre)}</td><td>${d.total}</td><td>${d.realizadas}</td><td>${d.inasistencias}</td><td>${pc(d.tasaInasistencia)}</td><td>${d.sinCerrar}</td></tr>`).join('')}</tbody></table></div>`:''}
<h3>Estudiantes con inasistencias</h3>${r.estudiantes.length?`<div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Matrícula</th><th>Estudiante</th><th>Inasistencias</th><th>Asistió</th><th>Última</th></tr></thead><tbody>${r.estudiantes.map(e=>`<tr><td>${esc(e.matricula)}</td><td>${esc(e.nombre)}</td><td>${e.inasistencias}</td><td>${e.realizadas}</td><td>${fecha(e.ultima)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">No hay inasistencias en este periodo.</p>'}`}
    catch(x){$('#rr').innerHTML='';toast(x.message,1)}};
  $('#rf').onsubmit=e=>{e.preventDefault();pintar()};pintar()}
// Administración (solo secretaría): docentes, estudiantes, padrón y actividad. Cada acción queda en la bitácora del servidor.
let adm='docentes',admDocs=[],admPad=[];
async function admin(){$('#app').innerHTML=`<h2>Administración</h2><div class="tabs noprint" role="tablist">${[['docentes','Docentes'],['estudiantes','Estudiantes'],['padron','Padrón'],['actividad','Actividad']].map(([k,t])=>`<button role="tab" aria-selected="${k===adm}" class="${k===adm?'on':''}" onclick="adm='${k}';admin()">${t}</button>`).join('')}</div><div id="ad"></div>`;
  try{await({docentes:admDocentes,estudiantes:admEstudiantes,padron:admPadron,actividad:admActividad}[adm]||admDocentes)()}catch(x){toast(x.message,1)}}
const estadoTag=a=>`<span class="tag ${a?'confirmada':'cancelada'}">${a?'activo':'desactivado'}</span>`;
async function admDocentes(){admDocs=await api('/admin/docentes');
  $('#ad').innerHTML=`<form class="card" id="df"><h3 id="dt">Agregar docente</h3><div class="fgrid"><div><label for="d1">Clave</label><input id="d1" required maxlength="40" placeholder="Ej. DOC010" autocomplete="off"></div>
<div><label for="d2">Nombre</label><input id="d2" required maxlength="120" placeholder="Dra. Ana Pérez"></div><div><label for="d3">Correo institucional</label><input id="d3" type="email" required maxlength="120"></div>
<div><label for="d4">Materias (separadas por comas)</label><input id="d4" required maxlength="200" placeholder="Estadística, Econometría"></div><div><label for="d5">Cubículo</label><input id="d5" maxlength="60"></div></div>
<p class="mut" id="dn">No se captura contraseña: le llega un correo para que el docente elija la suya con «Olvidé mi contraseña».</p><div class="row"><button class="gold" id="dg">Agregar docente</button><button type="button" class="ghost" id="dc" style="display:none" onclick="admDocentes()">Cancelar</button></div></form>
<div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Docente</th><th>Correo</th><th>Materias</th><th>Cubículo</th><th>Libres</th><th>Abiertas</th><th>Estado</th><th></th></tr></thead><tbody>${admDocs.map(d=>`<tr><td><b>${esc(d.nombre)}</b><div class="mut">${esc(d.clave)}</div></td><td>${esc(d.email)}</td><td>${esc(d.materias)}</td><td>${esc(d.cubiculo)}</td><td>${d.libres}</td><td>${d.abiertas}</td><td>${estadoTag(d.activo)}</td>
<td><button class="ghost" onclick="editarDocente(${d.id})">Editar</button> <button class="ghost" onclick="activarDocente(${d.id},${d.activo?'false':'true'})">${d.activo?'Desactivar':'Reactivar'}</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">Todavía no hay docentes.</td></tr>'}</tbody></table></div>`;
  $('#df').onsubmit=async e=>{e.preventDefault();const v=i=>$('#d'+i).value,ed=$('#df').dataset.id;
    try{if(ed){await api('/admin/docentes/'+ed,'PATCH',{nombre:v(2),email:v(3),materias:v(4),cubiculo:v(5)});toast('Cambios guardados.')}
      else{const r=await api('/admin/docentes','POST',{clave:v(1),nombre:v(2),email:v(3),materias:v(4),cubiculo:v(5)});toast(r.avisado?'Docente agregado y avisado por correo.':'Docente agregado, pero no se pudo enviar el correo: pídele que use «Olvidé mi contraseña».')}
      admDocentes()}catch(x){toast(x.message,1)}}}
function editarDocente(id){const d=admDocs.find(x=>x.id===id);if(!d)return;$('#df').dataset.id=id;$('#dt').textContent='Editar a '+d.nombre;
  [d.clave,d.nombre,d.email,d.materias,d.cubiculo].forEach((x,i)=>$('#d'+(i+1)).value=x);$('#d1').disabled=true;$('#dg').textContent='Guardar cambios';$('#dc').style.display='';$('#dn').textContent='Si cambias el correo, los avisos y la recuperación de contraseña irán al nuevo.';$('#d2').focus();$('#df').scrollIntoView({behavior:'smooth'})}
async function activarDocente(id,act){const d=admDocs.find(x=>x.id===id);if(!d)return;
  if(!act&&!confirm(`¿Desactivar a ${d.nombre}?\n\nNo podrá entrar al sistema, dejará de aparecer en el catálogo y nadie podrá agendarle.`+(d.abiertas?`\nTiene ${d.abiertas} asesoría(s) abierta(s) que siguen ahí: avisa a esos estudiantes.`:'')))return;
  try{await api('/admin/docentes/'+id,'PATCH',{activo:act});toast(act?'Docente reactivado.':'Docente desactivado.');admDocentes()}catch(x){toast(x.message,1)}}
function buscador(f,ph){return`<div class="card"><label for="bq">${ph}</label><input id="bq" type="search" maxlength="60" autocomplete="off"></div>`}
function conBusqueda(f){let t;$('#bq').oninput=()=>{clearTimeout(t);t=setTimeout(()=>f().catch(x=>toast(x.message,1)),250)};return $('#bq')}
async function admEstudiantes(){const pintar=async()=>{const r=await api('/admin/estudiantes?q='+encodeURIComponent($('#bq')?.value||''));
    $('#lst').innerHTML=`<p class="mut">${r.total>r.filas.length?`Mostrando ${r.filas.length} de ${r.total}: afina la búsqueda.`:`${r.total} estudiante(s) con cuenta.`}</p><div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Matrícula</th><th>Nombre</th><th>Correo</th><th>Abiertas</th><th>Estado</th><th></th></tr></thead><tbody>${r.filas.map(e=>`<tr><td>${esc(e.matricula)}</td><td>${esc(e.nombre)}</td><td>${esc(e.email)}</td><td>${e.abiertas}</td><td>${estadoTag(e.activo)}</td>
<td><button class="ghost" onclick="bloquear(${e.id},${e.activo?'false':'true'},'${esc(e.matricula)}')">${e.activo?'Bloquear':'Desbloquear'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Sin resultados.</td></tr>'}</tbody></table></div>`};
  window.admRefrescar=pintar;$('#ad').innerHTML=buscador(0,'Busca por matrícula, nombre o correo')+'<div id="lst"></div>';conBusqueda(pintar);await pintar()}
async function bloquear(id,act,m){if(!act&&!confirm(`¿Bloquear la cuenta ${m}? No podrá entrar ni agendar. Sus asesorías abiertas se conservan.`))return;
  try{await api('/admin/estudiantes/'+id,'PATCH',{activo:act});toast(act?'Cuenta desbloqueada.':'Cuenta bloqueada.');admRefrescar()}catch(x){toast(x.message,1)}}
async function admPadron(){const pintar=async()=>{const r=await api('/admin/padron?q='+encodeURIComponent($('#bq')?.value||''));admPad=r.filas;
    $('#lst').innerHTML=`<p class="mut">${r.total>r.filas.length?`Mostrando ${r.filas.length} de ${r.total}: afina la búsqueda.`:`${r.total} matrícula(s) en el padrón.`}</p><div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Matrícula</th><th>Nombre</th><th>Correo</th><th>Cuenta</th><th></th></tr></thead><tbody>${r.filas.map(p=>`<tr><td>${esc(p.matricula)}</td><td>${esc(p.nombre)}</td><td>${esc(p.email)}</td><td><span class="tag ${p.registrado?'confirmada':'pendiente'}">${p.registrado?'registrada':'sin cuenta'}</span></td>
<td>${p.registrado?'':`<button class="ghost" onclick="editarPadron('${esc(p.matricula)}')">Editar</button> <button class="ghost" onclick="quitarPadron('${esc(p.matricula)}')">Quitar</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Sin resultados.</td></tr>'}</tbody></table></div>`};
  window.admRefrescar=pintar;
  $('#ad').innerHTML=`<form class="card" id="pf"><h3 id="pt">Agregar al padrón</h3><div class="fgrid"><div><label for="p1">Matrícula</label><input id="p1" required maxlength="40" autocomplete="off"></div><div><label for="p2">Nombre</label><input id="p2" required maxlength="120"></div><div><label for="p3">Correo institucional (opcional)</label><input id="p3" type="email" maxlength="120"></div></div>
<p class="mut">Para cargar muchas matrículas a la vez usa el archivo CSV: <code>npm run cargar-padron -- archivo.csv</code>.</p><div class="row"><button class="gold" id="pg">Agregar</button><button type="button" class="ghost" id="pc" style="display:none" onclick="admPadron()">Cancelar</button></div></form>`+buscador(0,'Busca por matrícula, nombre o correo')+'<div id="lst"></div>';
  $('#pf').onsubmit=async e=>{e.preventDefault();const ed=$('#pf').dataset.m;try{if(ed){await api('/admin/padron/'+encodeURIComponent(ed),'PATCH',{nombre:$('#p2').value,email:$('#p3').value});toast('Cambios guardados.')}else{await api('/admin/padron','POST',{matricula:$('#p1').value,nombre:$('#p2').value,email:$('#p3').value});toast('Agregado al padrón.')}admPadron()}catch(x){toast(x.message,1)}};
  conBusqueda(pintar);await pintar()}
function editarPadron(m){const p=admPad.find(x=>x.matricula===m);if(!p)return;$('#pf').dataset.m=m;$('#pt').textContent='Editar '+m;$('#p1').value=m;$('#p1').disabled=true;$('#p2').value=p.nombre;$('#p3').value=p.email;$('#pg').textContent='Guardar cambios';$('#pc').style.display='';$('#p2').focus();$('#pf').scrollIntoView({behavior:'smooth'})}
async function quitarPadron(m){if(!confirm(`¿Quitar la matrícula ${m} del padrón? Si esa persona aún no se registró, ya no podrá hacerlo.`))return;
  try{await api('/admin/padron/'+encodeURIComponent(m),'DELETE');toast('Quitada del padrón.');admRefrescar()}catch(x){toast(x.message,1)}}
async function admActividad(){const a=await api('/admin/actividad');$('#ad').innerHTML=`<p class="mut">Lo último que se hizo desde este panel (máximo 50 movimientos).</p><div class="card" style="overflow-x:auto"><table class="rep"><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(new Date(x.fecha.replace(' ','T')+'Z').toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}))}</td><td>${esc(x.usuario)}</td><td>${esc(x.accion)}</td><td>${esc(x.detalle)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Todavía no hay movimientos.</td></tr>'}</tbody></table></div>`}
async function bitacora(){const n=await api('/notificaciones');$('#app').innerHTML=`<h2>Notificaciones registradas</h2><p class="mut">Copia de cada confirmación. “Pendiente” significa que el servidor de correo (SMTP) no está configurado.</p>`+
  n.map(x=>`<div class="card"><b>${esc(x.asunto)}</b> <span class="tag">${x.enviado?'enviado':'pendiente'}</span><div class="mut">${esc(x.destinatario)} · ${esc(x.fecha)}</div><pre style="white-space:pre-wrap;margin:.4rem 0 0">${esc(x.cuerpo)}</pre></div>`).join('')}
async function qr(){const r=await api('/qr'),ds=U.rol==='estudiante'?[]:await api('/qr/docentes'),local=/^https?:\/\/(localhost|127\.)/.test(r.url);
  const nombreArchivo=n=>'qr-'+n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase().replace(/^-|-$/g,'');
  $('#app').innerHTML=`<h2>Acceso por código QR</h2>${local?`<p class="tag cancelada" style="white-space:normal">Estos códigos apuntan a ${esc(r.url)}, que solo funciona en esta computadora. Quien instala el sistema debe definir BASE_URL con la dirección pública antes de imprimirlos.</p>`:''}
<div class="card row noprint"><img src="${r.png}" width="200" height="200" alt="Código QR hacia ${esc(r.url)}"><div><p>Para carteles de la facultad. Lleva a la entrada del sistema.</p><p class="mut">${esc(r.url)}</p></div></div>
${ds.length?`<div class="row noprint" style="justify-content:space-between;flex-wrap:wrap"><h3>${U.rol==='docente'?'Tu código QR':'Un código QR por docente'}</h3><button onclick="print()">Imprimir</button></div>
<p class="mut noprint">${U.rol==='docente'?'Pégalo en la puerta de tu cubículo o en tu material: quien lo escanee llega directo a tus horarios libres y puede agendar desde su celular.':'Cada docente puede imprimir el suyo desde su sesión. Aquí están todos, listos para imprimir en una hoja por docente.'}</p>
<div class="qrs">${ds.map(d=>`<div class="card qrcard"><h3>${esc(d.nombre)}</h3><div class="mut">${esc(d.cubiculo||'')}</div><img src="${d.png}" alt="Código QR de ${esc(d.nombre)}"><p><b>Escanea para agendar tu asesoría</b></p><div class="mut" style="word-break:break-all">${esc(d.url)}</div>
<a class="btn noprint" download="${nombreArchivo(d.nombre)}.png" href="${d.png}">Descargar imagen</a></div>`).join('')}</div>`:''}`}
init();
</script></body></html>
